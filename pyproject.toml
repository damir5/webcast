[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcast"
version = "0.1.0"
description = "Convert web articles to audio (MP3) using local TTS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.0",
    "trafilatura>=2.0",
    "mlx-audio>=0.2.1",
    "misaki>=0.9",
    "soundfile>=0.13",
    "numpy>=1.26",
]

[project.scripts]
webcast = "webcast.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/webcast"]
